<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="ti de">
  <title id="ti">Cross species pilot design</title>
  <desc id="de">Chlorella is cultured and concentrated, mitochondria are isolated from it, and those mitochondria are added to mammalian cells.</desc>
  <style>
    text { font-family: "Jost","Avenir Next","Futura","Century Gothic",system-ui,sans-serif; fill: #24233a; }
    .t  { font-size: 15px; font-weight: 600; fill: #16152b; }
    .s  { font-size: 13px; }
    .xs { font-size: 11.5px; fill: #5f5d7a; }
    .num { font-size: 13px; font-weight: 600; fill: #16152b; }
    .box { fill: #ece7f8; stroke: #3a3fb8; stroke-width: 2; }
    .boxw { fill: #faf8ff; stroke: #3a3fb8; stroke-width: 2; }
    .dash { fill: none; stroke: #3a3fb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .arr { fill: none; stroke: #3a3fb8; stroke-width: 2; marker-end: url(#a); }
    .ax { stroke: #8b87a8; stroke-width: 1.5; }
    .gl { stroke: #ded9ec; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a3fb8"/>
    </marker>
  </defs>
<rect class="box" x="12" y="26" width="230" height="86" rx="12"/>
<text class="s" x="127.0" y="63.0" text-anchor="middle" dominant-baseline="middle">Chlorella culture</text>
<text class="xs" x="127.0" y="96.0" text-anchor="middle" dominant-baseline="middle">grown and concentrated</text>
<rect class="box" x="271" y="26" width="230" height="86" rx="12"/>
<text class="s" x="386.0" y="55.5" text-anchor="middle" dominant-baseline="middle">Isolate</text>
<text class="s" x="386.0" y="70.5" text-anchor="middle" dominant-baseline="middle">mitochondria</text>
<text class="xs" x="386.0" y="89.5" text-anchor="middle" dominant-baseline="middle">differential</text>
<text class="xs" x="386.0" y="102.5" text-anchor="middle" dominant-baseline="middle">centrifugation</text>
<path class="arr" d="M 244,69.0 L 265,69.0"/>
<rect class="box" x="530" y="26" width="230" height="86" rx="12"/>
<text class="s" x="645.0" y="55.5" text-anchor="middle" dominant-baseline="middle">Add to mammalian</text>
<text class="s" x="645.0" y="70.5" text-anchor="middle" dominant-baseline="middle">cells</text>
<text class="xs" x="645.0" y="96.0" text-anchor="middle" dominant-baseline="middle">co-incubation</text>
<path class="arr" d="M 503,69.0 L 524,69.0"/><text class="xs" x="12" y="146">Schematic. Isolation is where the pilot stopped: step 3 was never reached.</text><text class="xs" x="12" y="166">Uptake would only be the first question; whether the mitochondria work in a mammalian cell is the second.</text>
</svg>
